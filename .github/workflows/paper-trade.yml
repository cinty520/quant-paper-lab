# 模拟盘定时运行（只用假钱，只读公开行情，不需要任何密钥）。
# 频率：每天一次。策略用日线，日线 UTC 00:00 收盘，更频繁运行不会产生新信号。
# 额度：每次约 1 分钟，每月约 30 分钟；公开仓库免费不限，私有仓库免费额度 2000 分钟/月。
name: paper-trade

on:
  schedule:
    - cron: "37 0 * * *"   # 每天 UTC 00:37（北京时间 08:37）；GitHub 定时任务可能延迟，漏跑会自动补记
  workflow_dispatch:        # 允许在网页上手动点 "Run workflow"

permissions:
  contents: write           # 只用于把台账提交回仓库

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 单元测试（失败则不记账）
        run: python -m pytest -q
      - name: 运行模拟盘
        run: python scripts/paper_trade.py
      - name: 提交台账
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper data/coinbase/BTC-USD_1d.csv data/coinbase/ETH-USD_1d.csv data/coinbase/meta.json
          git diff --cached --quiet && echo "无新数据" && exit 0
          git commit -m "paper: 更新模拟盘台账 $(date -u +%F)"
          git push
